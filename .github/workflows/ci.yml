name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: gitlearn
          MYSQL_USER: gitlearn
          MYSQL_PASSWORD: gitlearn
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u gitlearn -pgitlearn --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_DSN: gitlearn:gitlearn@tcp(127.0.0.1:3306)/gitlearn?parseTime=true&multiStatements=true&charset=utf8mb4
      GITLEARN_TEST_DSN: gitlearn:gitlearn@tcp(127.0.0.1:3306)/gitlearn?parseTime=true&multiStatements=true&charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - run: go run ./cmd/migrate -dir migrations
      - run: go run ./cmd/seed -dir seeds
      - run: go vet ./...
      - run: go test ./... -race -coverprofile=coverage.out
      - run: go build ./...
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gitlearn-api ./backend
      - run: docker build -t gitlearn-web ./frontend
